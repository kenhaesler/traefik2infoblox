services:
  traefik2infoblox:
    image: ghcr.io/kenhaesler/traefik2infoblox:latest
    build: .
    container_name: traefik2infoblox
    restart: unless-stopped
    volumes:
      # Read-only access to the Docker API to discover Traefik labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persist the last-seen timestamps across restarts (required for
      # reliable 7-day expiry).
      - traefik2infoblox-data:/data
    environment:
      INFOBLOX_URL: https://infoblox.example.com
      INFOBLOX_USERNAME: ${INFOBLOX_USERNAME:?set in .env}
      INFOBLOX_PASSWORD: ${INFOBLOX_PASSWORD:?set in .env}
      INFOBLOX_ZONE: example.com
      # FQDN of this Docker host; every discovered hostname becomes a CNAME
      # pointing here.
      CNAME_TARGET: dockerhost01.example.com
      # Optional settings (defaults shown):
      # INFOBLOX_WAPI_VERSION: v2.10
      # INFOBLOX_VIEW: default
      # INFOBLOX_SSL_VERIFY: "true"
      # SYNC_INTERVAL: 60s
      # EXPIRE_AFTER: 7d
      # RECORD_TTL: "300"
      # REQUIRE_TRAEFIK_ENABLE: "false"
      # DRY_RUN: "false"
      # LOG_LEVEL: INFO

volumes:
  traefik2infoblox-data:
